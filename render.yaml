# Render Blueprint for Campus Lost & Found (EduRev P09, Track P: Python + Django + PostgreSQL).
# FREE TIER. Secrets are NOT stored here: every `sync: false` value is entered once in the Render form.
#
# Free-tier limits (accepted for this deployment):
#   * Free PostgreSQL expires 30 days after creation -> upgrade it or export the data before then.
#   * No persistent disk: photos uploaded on the live site are lost on each redeploy/restart.
#   * No pre-deploy command: migrations run at start-up (safe to repeat; they are idempotent).
#   * No cron jobs: run `refresh_matches` / `check_ageing` manually or upgrade to add them.
#   * The service sleeps after ~15 minutes without traffic; the first request then takes ~1 minute.

databases:
  - name: campus-lostfound-db
    databaseName: lostfound
    user: lostfound
    plan: free
    region: oregon               # must match the web service so the internal hostname resolves
    postgresMajorVersion: "16"   # the CI suite runs on PostgreSQL 16

services:
  - type: web
    name: campus-lost-and-found
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: false            # deploy manually after reviewing each release
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Migrations create pg_trgm, the GIN indexes and the append-only triggers (migration 0002).
    startCommand: python manage.py migrate --noinput && python manage.py createcachetable && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 --access-logfile -
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true      # session/CSRF signing only; NOT the encryption key
      - key: FIELD_ENCRYPTION_KEYS
        sync: false              # paste the SAME value as in your local .env, or private details cannot be decrypted
      - key: DATABASE_URL
        fromDatabase:            # linked by Render: the internal URL is never copied by hand
          name: campus-lostfound-db
          property: connectionString
      - key: POSTGRES_SSLMODE
        value: "prefer"          # encrypt when the server offers it; works on Render's private network
      - key: STATIC_MANIFEST
        value: "True"
      - key: SERVE_MEDIA
        value: "True"
      - key: CLOUDINARY_URL
        sync: false              # cloudinary://<api key>:<api secret>@<cloud name>; keeps uploads across restarts
      - key: CACHE_BACKEND
        value: database          # shared by all gunicorn workers (rate limits, board cache)
      # Free web services cannot open SMTP ports (25/465/587), so email goes over HTTPS to a
      # Google Apps Script web app that sends from your own Gmail (docs/apps-script/Code.gs).
      # On a paid instance you can switch back to Gmail SMTP.
      - key: EMAIL_BACKEND
        value: lostfound.mail_backends.AppsScriptEmailBackend
      - key: APPS_SCRIPT_MAIL_URL
        sync: false              # the Web app URL ending in /exec
      - key: APPS_SCRIPT_MAIL_SECRET
        generateValue: true      # copy this value into the script property SECRET
      - key: DEFAULT_FROM_EMAIL
        sync: false              # e.g. Campus Lost & Found <your Gmail address>
