{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="panel empty">
  <p class="mono muted">Error {{ code }}</p>
  <h1>{{ title }}</h1>
  <p style="margin-inline:auto">{{ message }}</p>
  <div class="btn-row" style="justify-content:center"><a class="btn" href="{% url 'board' %}">Go to the board</a>{% if user.is_authenticated %}<a class="btn btn-ghost" href="{% url 'dashboard' %}">My dashboard</a>{% endif %}</div>
</div>
{% endblock %}
