<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Campus Lost & Found{% endblock %}
    </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        /* NAVBAR */

        .navbar {
            height: 70px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        .logo {
            font-size: 21px;
            font-weight: 700;
            color: #1d4ed8;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
        }

        .avatar {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            background: #1d4ed8;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }

        /* MAIN LAYOUT */

        .layout {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        /* SIDEBAR */

        .sidebar {
            width: 240px;
            background: white;
            border-right: 1px solid #e5e7eb;

            padding: 25px 15px;
        }

        .menu-title {
            font-size: 11px;
            font-weight: bold;
            color: #9ca3af;

            margin: 0 10px 12px;

            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sidebar a {
            display: block;

            text-decoration: none;

            color: #4b5563;

            padding: 12px 14px;

            border-radius: 8px;

            margin-bottom: 5px;

            font-size: 14px;
        }

        .sidebar a:hover {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .sidebar a.active {
            background: #eff6ff;
            color: #1d4ed8;
            font-weight: 600;
        }

        /* MAIN */

        .main {
            flex: 1;
            padding: 35px;
            max-width: 1600px;
        }

        /* MOBILE */

        @media (max-width: 768px) {

            .sidebar {
                display: none;
            }

            .main {
                padding: 20px;
            }

            .navbar {
                padding: 0 20px;
            }

            .user-name {
                display: none;
            }
        }
    </style>

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            Campus Lost & Found
        </div>

        <div class="user-section">

            <span class="user-name">
                Student
            </span>

            <div class="avatar">
                S
            </div>

        </div>

    </nav>


    <!-- PAGE LAYOUT -->

    <div class="layout">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="menu-title">
                Main Menu
            </div>

            <a href="/" class="active">
                Dashboard
            </a>

            <a href="#">
                Lost & Found Board
            </a>

            <a href="#">
                Report Lost Item
            </a>

            <a href="#">
                Report Found Item
            </a>

            <br>

            <div class="menu-title">
                My Activity
            </div>

            <a href="#">
                My Reports
            </a>

            <a href="#">
                My Claims
            </a>

            <a href="#">
                Notifications
            </a>

        </aside>


        <!-- CONTENT -->

        <main class="main">

            {% block content %}
            {% endblock %}

        </main>

    </div>

</body>

</html>
