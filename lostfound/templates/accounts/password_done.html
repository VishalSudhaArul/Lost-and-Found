{% extends "base.html" %}{% load lf %}
{% block title %}Password changed{% endblock %}
{% block content %}
<div class="narrow panel empty" style="--w:520px">
  <span class="empty-icon" style="background:var(--ok-wash);color:var(--ok)">{% icon "check-circle" "icon-lg" %}</span>
  <h1>Password changed</h1>
  <p>Your new password is active. Other devices stay signed in until their session ends.</p>
  <div class="btn-row"><a class="btn btn-primary" href="{% url 'dashboard' %}">Back to dashboard</a></div>
</div>
{% endblock %}
