{% extends "base.html" %}{% load lf %}
{% block title %}Password updated{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card panel empty">
    <span class="empty-icon" style="background:var(--ok-wash);color:var(--ok)">{% icon "check-circle" "icon-lg" %}</span>
    <h1>Password updated</h1>
    <p>You can now sign in with your new password.</p>
    <div class="btn-row"><a class="btn btn-primary" href="{% url 'login' %}">Sign in</a></div>
  </div>
</div>
{% endblock %}
