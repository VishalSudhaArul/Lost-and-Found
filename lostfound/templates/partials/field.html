<div class="field{% if f.errors %} has-error{% endif %} {{ extra_class }}">
  {% if f.field.widget.input_type == "checkbox" %}
    <label for="{{ f.id_for_label }}">{{ f }} {{ f.label }}</label>
  {% else %}
    <label for="{{ f.id_for_label }}">{{ f.label }}{% if not f.field.required %} <span class="muted small">(optional)</span>{% endif %}</label>
    {{ f }}
  {% endif %}
  {% if f.help_text %}<div class="help">{{ f.help_text }}</div>{% endif %}
  {% for e in f.errors %}<p class="error">{{ e }}</p>{% endfor %}
</div>
